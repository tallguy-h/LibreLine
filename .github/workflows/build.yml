name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LibreLine.slnx
      - run: dotnet build LibreLine.slnx --configuration Release --no-restore
      - run: dotnet test LibreLine.slnx --configuration Release --no-build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t libreline .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test LibreLine.Windows.slnx --configuration Release
      - run: dotnet build installer/LibreLine.Installer.wixproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: libreline-msi
          path: installer/bin/Release/*.msi
