// Recovered from embedded FileDescriptorProto in "Ticket to Ride.exe"
syntax = "proto2";

package com.daysofwonder;

option java_package = "com.daysofwonder.game.pb";
option java_outer_classname = "PBGame";
option optimize_for = SPEED;

message AchievementProperties {
  message Property {
    required string key = 1;
    optional int32 int_value = 2;
    optional string string_value = 3;
    optional float float_value = 4;
    optional bool bool_value = 5;
  }
  repeated .com.daysofwonder.AchievementProperties.Property properties = 1;
}

message AchievementObject {
  optional string class_name = 1;
  optional bool done = 2;
  optional .com.daysofwonder.AchievementProperties properties = 3;
}

message AchievementsCache {
  repeated string achievement_id = 1;
}

message AchievementsReporter {
  optional string map_id = 1;
  repeated .com.daysofwonder.AchievementObject achievement = 2;
}

